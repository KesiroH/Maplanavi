# 高德地图 API 配置
amap:
  api_key: ${AMAP_API_KEY}  # 从环境变量读取
  timeout: 10
  max_retries: 3
  retry_delay: 1.0

# LLM 配置

llm:
  type: doubao  
  api_key: ${VOLCENGINE_API_KEY}  
  model: doubao-seed-2-0-mini-260215 
  base_url: https://ark.cn-beijing.volces.com/api/v3
  timeout: 90
  thinking_enabled: false
  temperature: 0.3
  max_tokens: 50000
  retry: 2

# 用户配置文件路径
user_profile:
  path: modules/user.json

# POI 数据配置
poi:
  data_path: haidian_poi.json
  categories_path: poi_categories.json
  max_distance_km: 10.0

# 评分权重配置
scoring:
  weights:
    llm_relevance: 0.5
    amap_rating: 0.3
    distance_decay: 0.2

# 输出配置
output:
  path: output
  formats:
    - json
    - csv
  encoding: utf-8
